# Local implementation; remains disabled until HOW_RANKS_ENABLED=true.
name: Lightweight daily role ranks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: vars.HOW_RANKS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore successful publication and compute in memory
        env:
          RANKS_URL: ${{ vars.HOW_RANKS_URL }}
        run: node scripts/collect-daily-ranks.js --apply --restore-url "$RANKS_URL"
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        id: pages
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npm run verify:pages
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Refuse publication if main changed during collection
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
      - name: Record confirmed publication time only after successful deployment
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          RANKS_URL: ${{ vars.HOW_RANKS_URL }}
        run: node scripts/verify-rank-publication.js
      - uses: actions/upload-artifact@v4
        with:
          name: confirmed-rank-publication
          path: rank-publication.json
          retention-days: 7
