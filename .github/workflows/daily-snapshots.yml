name: Daily competitive all-rank snapshots
on:
  workflow_dispatch:
  schedule:
    # 10:23 Asia/Seoul. All 9 raw cohorts per region; no fabricated past rows.
    - cron: '23 1 * * *'
permissions:
  contents: write
concurrency:
  group: how-snapshot-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect all original cohorts (Asia, Europe, Americas)
        shell: bash
        run: |
          set -euo pipefail
          for region in asia europe americas; do
            node scripts/collect-division-batch.js --region "$region" --apply
          done
      - name: Commit validated observations only
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/snapshots/index.json public/data/snapshots/*.json
          if git diff --cached --quiet; then
            echo "No new valid observations."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive daily competitive rank observations (3 regions, 9 cohorts each)"
          git push origin HEAD:main
